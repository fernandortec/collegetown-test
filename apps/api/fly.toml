# fly.toml app configuration file generated for collegetown-test on 2026-05-03T22:32:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'collegetown-test'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "npm run start"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
